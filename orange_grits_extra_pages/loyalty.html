<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loyalty Rewards | Orange Grits Café</title>
  <style>
    body { background: #f3e5f5; font-family: sans-serif; padding: 2em; text-align: center; }
    h1 { color: #6a1b9a; }
    .punch-card { display: flex; justify-content: center; flex-wrap: wrap; gap: 1em; margin-top: 2em; }
    .stamp { width: 60px; height: 60px; background: #fff; border: 2px dashed #ba68c8; border-radius: 50%; line-height: 60px; font-weight: bold; color: #6a1b9a; }
    .stamp.filled { background: #ba68c8; color: #fff; }
  </style>
</head>
<body>
  <h1>Flavor Loyalty Card</h1>
  <p>Collect 10 stamps to earn a free grits or sauce!</p>
  <div class="punch-card">
    <div class="stamp filled">✓</div>
    <div class="stamp filled">✓</div>
    <div class="stamp">3</div>
    <div class="stamp">4</div>
    <div class="stamp">5</div>
    <div class="stamp">6</div>
    <div class="stamp">7</div>
    <div class="stamp">8</div>
    <div class="stamp">9</div>
    <div class="stamp">10</div>
  </div>
</body>
</html>
